<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carriot</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" disabled>
<script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html-ui.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f5; --border: #e3e6ea; --text: #1d2127; --muted: #69707a;
  --accent: #2f6fde; --red: #d63a3a; --red-bg: #fdecec; --yellow: #b7791f; --yellow-bg: #fdf5e6;
  --green: #1f9d55; --green-bg: #e8f6ee; --blue: #2f6fde; --blue-bg: #e8f0fd; --code: #f3f4f6;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #161a20; --panel-2: #1c2129; --border: #2a303a; --text: #e6e9ee; --muted: #8b93a1;
    --accent: #6ea0ff; --red: #ff6b6b; --red-bg: #3a1d1f; --yellow: #f2b84b; --yellow-bg: #3a2f17;
    --green: #4cc38a; --green-bg: #173226; --blue: #6ea0ff; --blue-bg: #1b2a45; --code: #1c2129;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #161a20; --panel-2: #1c2129; --border: #2a303a; --text: #e6e9ee; --muted: #8b93a1;
  --accent: #6ea0ff; --red: #ff6b6b; --red-bg: #3a1d1f; --yellow: #f2b84b; --yellow-bg: #3a2f17;
  --green: #4cc38a; --green-bg: #173226; --blue: #6ea0ff; --blue-bg: #1b2a45; --code: #1c2129;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; height: 100vh; }
aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.top { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
.top h1 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.top h1 .live { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.top h1 .live.on { background: var(--green); }
.collapse { margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 6px; width: 26px; height: 24px; padding: 0; color: var(--muted); font-size: 13px; line-height: 1; }
.collapse:hover { color: var(--text); background: var(--panel-2); }
.app.collapsed { grid-template-columns: 52px 1fr; }
.app.collapsed .top { padding: 12px 0 8px; }
.app.collapsed .top h1 { flex-direction: column; gap: 10px; margin: 0; }
.app.collapsed .brand, .app.collapsed .counts, .app.collapsed .tools, .app.collapsed .group, .app.collapsed .card .name, .app.collapsed .card .age,
.app.collapsed .card .l2, .app.collapsed .card .detail { display: none; }
.app.collapsed .collapse { margin: 0; }
.app.collapsed .list { padding: 6px 4px; }
.app.collapsed .card { display: flex; justify-content: center; padding: 10px 0; }
.app.collapsed .card .l1 { justify-content: center; }
.app.collapsed .card.sel { border-color: var(--accent); }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.pill.red { color: var(--red); background: var(--red-bg); border-color: transparent; }
.pill.yellow { color: var(--yellow); background: var(--yellow-bg); border-color: transparent; }
.pill.green { color: var(--green); background: var(--green-bg); border-color: transparent; }
.tools { display: flex; gap: 6px; margin-top: 8px; }
.tools button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
.tools button.update { color: var(--yellow); border-color: var(--yellow); }
.tools button[disabled] { opacity: .6; cursor: default; }
.list { overflow-y: auto; flex: 1; padding: 6px 8px 16px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 8px 6px; }
.card { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px; }
.card:hover { background: var(--panel-2); }
.card.sel { background: var(--panel-2); border-color: var(--border); }
.card .l1 { display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.s-blocked .dot { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
.s-waiting .dot { background: var(--yellow); }
.s-working .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
.s-planning .dot { background: var(--blue); animation: pulse 1.6s ease-in-out infinite; }
.s-idle .dot { background: transparent; border: 1.5px solid var(--muted); }
.s-idle .name, .s-idle .state { color: var(--muted); font-weight: 500; }
@keyframes pulse { 50% { opacity: .35; } }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.age { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.card .l2 { display: flex; gap: 6px; align-items: center; margin: 2px 0 0 17px; font-size: 12px; }
.state { font-weight: 500; }
.s-blocked .state { color: var(--red); } .s-waiting .state { color: var(--yellow); }
.s-working .state { color: var(--green); } .s-planning .state { color: var(--blue); }
.chip { font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
.detail { margin: 2px 0 0 17px; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; }
.head { padding: 14px 24px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
.head .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
.s-blocked .badge { color: var(--red); background: var(--red-bg); } .s-waiting .badge { color: var(--yellow); background: var(--yellow-bg); }
.s-working .badge { color: var(--green); background: var(--green-bg); } .s-planning .badge { color: var(--blue); background: var(--blue-bg); }
.s-idle .badge { color: var(--muted); background: var(--panel-2); }
.meta { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
.actions { margin-left: auto; display: flex; gap: 8px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 5px 12px; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab[disabled] { opacity: .4; cursor: default; }
.body { overflow-y: auto; flex: 1; padding: 20px 24px 120px; }
.md { max-width: 900px; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3 { line-height: 1.25; margin: 1.2em 0 .5em; } .md h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.md h2 { font-size: 1.25em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.md code { background: var(--code); padding: .15em .35em; border-radius: 4px; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; } .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
.md blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 3px solid var(--border); }
.md a { color: var(--accent); }
.prompt { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; white-space: pre-wrap; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.screen { background: #0d1117; color: #d0d7de; border-radius: 8px; padding: 14px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.screen { --ansi-0: #484f58; --ansi-1: #ff7b72; --ansi-2: #3fb950; --ansi-3: #d29922; --ansi-4: #58a6ff; --ansi-5: #bc8cff; --ansi-6: #39c5cf; --ansi-7: #b1bac4;
  --ansi-8: #6e7681; --ansi-9: #ffa198; --ansi-10: #56d364; --ansi-11: #e3b341; --ansi-12: #79c0ff; --ansi-13: #d2a8ff; --ansi-14: #56d4dd; --ansi-15: #f0f6fc; }
.pr-card { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 18px; overflow: hidden; }
.pr-card .h { padding: 10px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pr-card .c { padding: 4px 14px 14px; }
.branch { font: 12px ui-monospace, Menlo, monospace; background: var(--blue-bg); color: var(--blue); padding: 1px 6px; border-radius: 4px; }
.commits { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.commits li { padding: 6px 14px; border-top: 1px solid var(--border); } .commits li:first-child { border-top: 0; }
.sha { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-right: 8px; }
.pr-title { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
.pr-head { max-width: 1100px; overflow-wrap: anywhere; }
.files-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.files-bar .label { margin: 0 auto 0 0; }
.files { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.files.no-tree { grid-template-columns: minmax(0, 1fr); } .files.no-tree .tree { display: none; }
.tree { position: sticky; top: 0; max-height: calc(100vh - 210px); overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 6px 0; font-size: 12.5px; }
.tree-dir { color: var(--muted); padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-file { display: flex; align-items: center; width: 100%; gap: 6px; background: none; border: 0; text-align: left; padding: 3px 8px; }
.tree-file:hover { background: var(--panel-2); } .tree-file.on { background: var(--blue-bg); }
.tree-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-added .tree-name { color: var(--green); } .st-deleted .tree-name { color: var(--red); text-decoration: line-through; }
.tree-stat, .tree-cm { font: 11px ui-monospace, Menlo, monospace; white-space: nowrap; } .tree-cm { color: var(--accent); }
.add { color: var(--green); } .del { color: var(--red); }
.file { margin-bottom: 16px; }
.d2h-wrapper { max-width: 100%; } .d2h-file-wrapper { position: relative; border-radius: 8px; margin-bottom: 0; }
.file .d2h-file-header { position: sticky; top: 0; z-index: 3; }
.file-actions { margin-left: auto; display: flex; gap: 6px; padding-left: 8px; } .file-actions .btn { padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.d2h-code-line-ctn.hljs { background: transparent; }
/* Dark tints are translucent; laid over the page background, line numbers stay opaque while code scrolls under them. */
.d2h-dark-color-scheme .d2h-ins { --tint: var(--d2h-dark-ins-bg-color); } .d2h-dark-color-scheme .d2h-del { --tint: var(--d2h-dark-del-bg-color); }
.d2h-dark-color-scheme .d2h-info { --tint: var(--d2h-dark-info-bg-color); }
.d2h-dark-color-scheme :is(.d2h-emptyplaceholder, .d2h-code-side-emptyplaceholder) { --tint: var(--d2h-dark-empty-placeholder-bg-color); }
.d2h-dark-color-scheme :is(.d2h-code-linenumber, .d2h-code-side-linenumber) { background: linear-gradient(var(--tint, transparent), var(--tint, transparent)) var(--d2h-dark-bg-color); }
td.d2h-code-linenumber:not(.d2h-info), td.d2h-code-side-linenumber:not(.d2h-info):not(.d2h-code-side-emptyplaceholder) { cursor: pointer; }
td.d2h-code-linenumber:not(.d2h-info):hover, td.d2h-code-side-linenumber:not(.d2h-info):not(.d2h-code-side-emptyplaceholder):hover { background: var(--blue-bg); color: var(--blue); }
.expandable td.d2h-info { cursor: pointer; } .expandable td.d2h-info:hover { color: var(--accent); }
.cm-row > td { padding: 8px 12px; background: var(--panel-2); white-space: normal; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
.d2h-file-diff, .d2h-file-side-diff { container-type: inline-size; }
.cm-box { max-width: min(760px, calc(100cqw - 32px)); position: sticky; left: 12px; }
.cm-box.saved { border: 1px solid var(--border); border-radius: 6px; background: var(--panel); padding: 6px 12px; }
.cm-box.saved .md { max-width: none; }
.cm-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.cm-input { width: 100%; resize: vertical; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; background: var(--bg); color: var(--text); font: inherit; }
.cm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.review-list { list-style: none; margin: 0 0 10px; padding: 0; font-size: 13px; }
.review-list li { padding: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font: 12px ui-monospace, Menlo, monospace; }
.muted { color: var(--muted); }
.btn[disabled] { opacity: .5; cursor: default; }
.reply { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 8px; }
.reply textarea { flex: 1; resize: none; height: 38px; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; background: var(--bg); color: var(--text); font: inherit; }
.toast { position: fixed; bottom: 70px; right: 20px; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .92; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 45vh; }
  .app.collapsed { grid-template-columns: 1fr; } .app.collapsed .list { display: none; }
  .head, .body, .reply { padding-left: 16px; padding-right: 16px; }
  .actions { margin-left: 0; }
}
@media (max-width: 1000px) {
  .files { grid-template-columns: minmax(0, 1fr); } .tree { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="top">
      <h1><span class="live" id="live"></span><span class="brand">carriot</span><button class="collapse" id="collapse"></button></h1>
      <div class="counts" id="counts"></div>
      <div class="tools">
        <button id="notify">Enable notifications</button>
        <button id="theme">Theme</button>
        <button id="restart" title="Restart the dashboard server so it runs the latest carriot code">Restart server</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"><div class="empty">Select a session</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN = "__CARRIOT_TOKEN__";
const BLOCKED = ["needs_approval", "question", "plan_review", "pr_review"];
const WHERE = { parked: "parked", background: "background", attached: "background · attached" };
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
};
const md = (text) => {
  const div = h("div", { class: "md" });
  div.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
  for (const a of div.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
  return div;
};
const api = async (path, opts = {}) => {
  const res = await fetch(path, { ...opts, headers: { "x-carriot-token": TOKEN, "content-type": "application/json", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
};
const ago = (ts) => {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`;
};
const kind = (s) => s.stale ? "idle" : BLOCKED.includes(s.state) || s.attention ? "blocked" : s.state === "waiting" ? "waiting" : s.mode === "plan" ? "planning" : "working";
const shortCwd = (cwd) => (cwd || "").replace(/^\/Users\/[^/]+/, "~");
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); };

let sessions = [];
let selected = decodeURIComponent(location.hash.slice(1)) || null;
let tab = null;
let renderedKey = "";
let lastView = "";
const prevKind = new Map();
const artifactCache = new Map();
// Rendered PR views by artifact id, reused across live updates so expanded context and open drafts survive.
const prViews = new Map();
const reviews = new Map();

function renderList() {
  const groups = [["Needs you", "blocked"], ["Your turn", "waiting"], ["Working", null], ["Idle · no activity for a day", "idle"]];
  const list = $("#list");
  list.replaceChildren();
  const count = { blocked: 0, waiting: 0, working: 0, idle: 0 };
  for (const s of sessions) count[kind(s) === "planning" ? "working" : kind(s)]++;
  $("#counts").replaceChildren(
    h("span", { class: `pill ${count.blocked ? "red" : ""}` }, `${count.blocked} need you`),
    h("span", { class: `pill ${count.waiting ? "yellow" : ""}` }, `${count.waiting} your turn`),
    h("span", { class: `pill ${count.working ? "green" : ""}` }, `${count.working} working`),
    h("span", { class: "pill" }, `${count.idle} idle`),
  );
  document.title = count.blocked + count.waiting ? `(${count.blocked + count.waiting}) Carriot` : "Carriot";
  if (!sessions.length) list.append(h("div", { class: "empty" }, "No live sessions yet. Start an agent with the carriot hooks installed."));
  for (const [title, k] of groups) {
    const items = sessions.filter((s) => (k ? kind(s) === k : ["working", "planning"].includes(kind(s))));
    if (!items.length) continue;
    list.append(h("div", { class: "group" }, `${title} · ${items.length}`));
    for (const s of items) {
      list.append(h("button", { class: `card s-${kind(s)} ${s.id === selected ? "sel" : ""}`, title: `${s.display_name} · ${s.label}`, onclick: () => select(s.id) },
        h("div", { class: "l1" }, h("span", { class: "dot" }), h("span", { class: "name", title: s.display_name }, s.display_name), h("span", { class: "age", "data-ts": s.state_since }, ago(s.state_since))),
        h("div", { class: "l2" }, h("span", { class: "state" }, s.label),
          s.agent !== "claude" ? h("span", { class: "chip" }, s.agent) : null,
          s.location ? h("span", { class: "chip" }, WHERE[s.location]) : null,
          s.artifacts.plan ? h("span", { class: "chip" }, "plan") : null,
          s.artifacts.pr ? h("span", { class: "chip" }, "PR") : null),
        s.detail ? h("div", { class: "detail", title: s.detail }, s.detail) : null,
      ));
    }
  }
}

function defaultTab(s) {
  if (s.state === "plan_review" && s.artifacts.plan) return "plan";
  if (s.state === "pr_review" && s.artifacts.pr) return "pr";
  if (s.state === "needs_approval" || s.state === "question") return "screen";
  return "overview";
}

function select(id) {
  selected = id;
  tab = null;
  renderedKey = "";
  history.replaceState(null, "", `#${id}`);
  renderList();

/** A terminal colour: 0-15 follow the .screen theme, 16-255 are the fixed xterm cube and greys, strings are truecolour. */
function ansiColour(c) {
  if (typeof c === "string") return c;
  if (c < 16) return `var(--ansi-${c})`;
  if (c >= 232) { const g = 8 + 10 * (c - 232); return `rgb(${g},${g},${g})`; }
  const lv = [0, 95, 135, 175, 215, 255], n = c - 16;
  return `rgb(${lv[Math.floor(n / 36)]},${lv[Math.floor(n / 6) % 6]},${lv[n % 6]})`;
}

/** Applies one SGR parameter list to the running attribute state. */
function sgr(st, params) {
  const p = params === "" ? [0] : params.split(/[;:]/).map((x) => Number(x) || 0);
  st = { ...st };
  for (let i = 0; i < p.length; i++) {
    const n = p[i];
    if (n === 0) st = {};
    else if (n === 1) st.bold = true; else if (n === 2) st.dim = true; else if (n === 3) st.italic = true;
    else if (n === 4) st.underline = true; else if (n === 7) st.inverse = true; else if (n === 9) st.strike = true;
    else if (n === 22) st.bold = st.dim = false; else if (n === 23) st.italic = false; else if (n === 24) st.underline = false;
    else if (n === 27) st.inverse = false; else if (n === 29) st.strike = false;
    else if (n >= 30 && n <= 37) st.fg = n - 30; else if (n >= 90 && n <= 97) st.fg = n - 82; else if (n === 39) delete st.fg;
    else if (n >= 40 && n <= 47) st.bg = n - 40; else if (n >= 100 && n <= 107) st.bg = n - 92; else if (n === 49) delete st.bg;
    else if (n === 38 || n === 48) {
      const key = n === 38 ? "fg" : "bg";
      if (p[i + 1] === 5) { st[key] = p[i + 2]; i += 2; }
      else if (p[i + 1] === 2) { st[key] = `rgb(${p[i + 2]},${p[i + 3]},${p[i + 4]})`; i += 4; }
    }
  }
  return st;
}

/** Terminal text with SGR escapes as text and styled spans; other escapes are dropped. Never parses the text as HTML. */
function ansiNodes(text) {
  const out = [];
  let st = {}, last = 0, m;
  const push = (t) => {
    if (!t) return;
    let fg = st.fg != null ? ansiColour(st.fg) : null, bg = st.bg != null ? ansiColour(st.bg) : null;
    if (st.inverse) [fg, bg] = [bg ?? "#0d1117", fg ?? "#d0d7de"];
    const css = [fg && `color:${fg}`, bg && `background:${bg}`, st.bold && "font-weight:600", st.dim && "opacity:.6",
      st.italic && "font-style:italic", (st.underline || st.strike) && `text-decoration:${[st.underline && "underline", st.strike && "line-through"].filter(Boolean).join(" ")}`]
      .filter(Boolean).join(";");
    out.push(css ? h("span", { style: css }, t) : document.createTextNode(t));
  };
  const re = /\x1b\[([0-9;:]*)m|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b\[[0-9;?<>=]*[ -\/]*[@-~]|\x1b[@-_]/g;
  while ((m = re.exec(text))) {
    push(text.slice(last, m.index));
    last = re.lastIndex;
    if (m[1] !== undefined) st = sgr(st, m[1]);
  }
  push(text.slice(last));
  return out;
}

const effectiveTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function syncHljs() {
  const dark = effectiveTheme() === "dark";
  $("#hljs-light").disabled = dark;
  $("#hljs-dark").disabled = !dark;
}
function themeChanged() {
  syncHljs();
  prViews.clear();
  renderMain(true);

function reviewComments(id) {
  if (!reviews.has(id)) {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(`carriot-review-${id}`) || "[]"); } catch {}
    reviews.set(id, Array.isArray(saved) ? saved : []);
  }
  return reviews.get(id);
}
const saveReview = (id) => { try { localStorage.setItem(`carriot-review-${id}`, JSON.stringify(reviews.get(id))); } catch {} };

/** Splits a unified diff into files with their paths, status and line counts. */
function diffFiles(diff) {
  const files = [];
  for (const chunk of diff.split(/^(?=diff --git )/m)) {
    const head = chunk.match(/^diff --git a\/(.+?) b\/(.+)$/m);
    if (!head) continue;
    let add = 0, del = 0, inHunk = false;
    for (const l of chunk.split("\n")) {
      if (l.startsWith("@@")) inHunk = true;
      else if (inHunk && l[0] === "+") add++;
      else if (inHunk && l[0] === "-") del++;
    }
    const renamed = /^rename to /m.test(chunk);
    files.push({
      path: head[2], oldPath: head[1], diff: chunk, add, del,
      status: /^new file mode/m.test(chunk) ? "added" : /^deleted file mode/m.test(chunk) ? "deleted" : renamed ? "renamed" : "modified",
    });
  }
  return files;
}

function fileTree(files, counts, onPick) {
  const root = { dirs: new Map(), files: [] };
  files.forEach((f, i) => {
    const parts = f.path.split("/");
    let node = root;
    for (const p of parts.slice(0, -1)) {
      if (!node.dirs.has(p)) node.dirs.set(p, { dirs: new Map(), files: [] });
      node = node.dirs.get(p);
    }
    node.files.push({ name: parts.at(-1), f, i });
  });
  const pad = (depth) => `padding-left:${depth * 12 + 8}px`;
  const walk = (node, depth) => {
    const out = [];
    for (let [name, dir] of [...node.dirs].sort(([a], [b]) => a.localeCompare(b))) {
      while (dir.dirs.size === 1 && !dir.files.length) {
        const [[child, next]] = dir.dirs;
        name += `/${child}`;
        dir = next;
      }
      out.push(h("div", { class: "tree-dir", style: pad(depth), title: name }, `${name}/`), ...walk(dir, depth + 1));
    }
    for (const x of node.files.sort((a, b) => a.name.localeCompare(b.name)))
      out.push(h("button", { class: `tree-file st-${x.f.status}`, style: pad(depth), title: x.f.path, "data-idx": x.i, onclick: () => onPick(x.i) },
        h("span", { class: "tree-name" }, x.name),
        counts[x.f.path] ? h("span", { class: "tree-cm", title: "pending comments" }, `💬${counts[x.f.path]}`) : null,
        h("span", { class: "tree-stat" }, h("span", { class: "add" }, `+${x.f.add}`), " ", h("span", { class: "del" }, `−${x.f.del}`))));
    return out;
  };
  return walk(root, 0);
}

/** Inserts a full-width row after `tr` (and after any comment rows already there), mirrored by a spacer in a split view. */
function insertRow(fileEl, tr, content, cls) {
  let anchor = tr;
  while (anchor.nextElementSibling?.classList.contains("cm-row")) anchor = anchor.nextElementSibling;
  const row = h("tr", { class: `cm-row ${cls}` }, h("td", { colspan: "2" }, content));
  anchor.after(row);
  const tbody = row.parentElement;
  const other = [...fileEl.querySelectorAll(".d2h-file-side-diff tbody")].find((t) => t !== tbody);
  if (other) {
    const idx = [...tbody.rows].indexOf(row);
    const spacer = h("tr", { class: "cm-spacer" }, h("td", { colspan: "2" }));
    other.rows[idx - 1] ? other.rows[idx - 1].after(spacer) : other.prepend(spacer);
    new ResizeObserver(() => { spacer.style.height = `${row.offsetHeight}px`; }).observe(row);
    row.spacer = spacer;
  }
  return row;
}
const removeRow = (row) => { row.spacer?.remove(); row.remove(); };

function findRow(fileEl, side, line) {
  const sides = fileEl.querySelectorAll(".d2h-file-side-diff");
  if (sides.length) {
    for (const td of sides[side === "old" ? 0 : 1].querySelectorAll("td.d2h-code-side-linenumber"))
      if (parseInt(td.textContent, 10) === line) return td.parentElement;
    return null;
  }
  for (const td of fileEl.querySelectorAll("td.d2h-code-linenumber"))
    if (parseInt(td.querySelector(side === "old" ? ".line-num1" : ".line-num2")?.textContent, 10) === line) return td.parentElement;
  return null;
}

/** Which line a click on a line-number cell refers to, in either view. */
function clickedLine(fileEl, td) {
  if (td.classList.contains("d2h-code-side-linenumber")) {
    const side = td.closest(".d2h-file-side-diff") === fileEl.querySelector(".d2h-file-side-diff") ? "old" : "new";
    return { side, line: parseInt(td.textContent, 10) };
  }
  const n2 = parseInt(td.querySelector(".line-num2")?.textContent, 10);
  return n2 ? { side: "new", line: n2 } : { side: "old", line: parseInt(td.querySelector(".line-num1")?.textContent, 10) };
}

function reviewMessage(a, list, general, pending) {
  const parts = [pending
    ? `Review of the PR preview "${a.title || "untitled"}". Don't open the PR yet: address this feedback, then try again.`
    : `Review comments on the PR "${a.title || "untitled"}". Please address them.`];
  if (general) parts.push(general);
  list.forEach((c, i) => parts.push(`${i + 1}. ${c.file}:${c.line}${c.side === "old" ? " (removed line)" : ""}\n   > ${c.code.trim()}\n   ${c.text.replace(/\n/g, "\n   ")}`));
  return parts.join("\n\n");
}

function renderPr(a, sessionId) {
  const m = a.meta || {};
  const files = diffFiles(a.diff || "");
  const comments = reviewComments(a.id);
  const canExpand = !!(m.baseSha && m.headSha);
  let side = window.innerWidth > 1400;

  const wrap = h("div", { class: "pr" });
  wrap.append(h("div", { class: "pr-head" },
    h("div", { class: "pr-title" }, a.title || "(untitled)"),
    h("div", { class: "meta", style: "margin-bottom:16px" },
      m.url ? h("a", { href: m.url, target: "_blank", rel: "noopener" }, "Opened ↗") : h("strong", {}, m.draft ? "Draft · not created yet" : "Not created yet"),
      " · wants to merge ", h("span", { class: "branch" }, m.head || "?"), " into ", h("span", { class: "branch" }, m.base || "?"),
      m.repo ? ` · ${m.repo}` : "", m.stat ? ` · ${m.stat}` : ""),
    h("div", { class: "pr-card" }, h("div", { class: "h" }, h("strong", {}, "Description")), h("div", { class: "c" }, md(a.body || "_No description provided._"))),
    m.commits?.length ? h("div", { class: "pr-card" }, h("div", { class: "h" }, h("strong", {}, `${m.commits.length} commit${m.commits.length > 1 ? "s" : ""}`)),
      h("ul", { class: "commits" }, m.commits.map((c) => h("li", {}, h("span", { class: "sha" }, c.slice(0, 7)), c.slice(8))))) : null,
  ));

  // Review: pending line comments plus overall feedback, sent to the agent as one message.
  const general = h("textarea", { class: "cm-input", rows: 2, placeholder: "Overall feedback (optional). Click a line number in the diff to comment on a line." });
  const reviewTitle = h("strong");
  const reviewList = h("ul", { class: "review-list" });
  const sendBtn = h("button", { class: "btn primary" });
  const drawReview = () => {
    const s = sessions.find((x) => x.id === sessionId);
    const pending = s?.state === "pr_review";
    reviewTitle.textContent = comments.length ? `Review · ${comments.length} pending comment${comments.length > 1 ? "s" : ""}` : "Review";
    reviewList.replaceChildren(...comments.map((c) => h("li", {},
      h("button", { class: "link", onclick: () => jumpTo(c) }, `${c.file}:${c.line}`), " ", h("span", { class: "muted" }, c.text.split("\n")[0]))));
    sendBtn.textContent = pending ? "Request changes" : "Send to agent";
    sendBtn.title = pending ? "Declines the pending gh pr create and sends this review to the agent" : "Sends this review to the agent";
    sendBtn.disabled = !comments.length && !general.value.trim();
    drawTree();
  };
  general.addEventListener("input", () => { sendBtn.disabled = !comments.length && !general.value.trim(); });
  sendBtn.addEventListener("click", async () => {
    const s = sessions.find((x) => x.id === sessionId);
    if (!s?.pane) return toast("Attach to the session first (Open in terminal), then send.");
    const pending = s.state === "pr_review";
    try {
      await api(`/api/sessions/${s.id}/send`, { method: "POST", body: JSON.stringify({ text: reviewMessage(a, comments, general.value.trim(), pending), reject: pending }) });
      comments.length = 0;
      saveReview(a.id);
      general.value = "";
      for (const row of wrap.querySelectorAll(".cm-row.saved")) removeRow(row);
      drawReview();
      toast("Review sent");
    } catch (e) { toast(e.message); }
  });
  wrap.append(h("div", { class: "pr-card pr-head" }, h("div", { class: "h" }, reviewTitle), h("div", { class: "c", style: "padding-top:10px" }, reviewList, general,
    h("div", { class: "cm-actions" }, sendBtn))));

  // Files changed: tree on the left, one diff2html render per file so a file can be re-drawn alone.
  const tree = h("nav", { class: "tree" });
  const grid = h("div", { class: "files" });
  const sections = files.map((f, i) => h("section", { class: `file ${canExpand ? "expandable" : ""}`, "data-idx": i }));
  const drawTree = () => {
    const counts = {};
    for (const c of comments) counts[c.file] = (counts[c.file] || 0) + 1;
    tree.replaceChildren(...fileTree(files, counts, (i) => sections[i].scrollIntoView({ block: "start" })));
  };

  const placeComment = (el, c) => {
    const tr = findRow(el, c.side, c.line);
    if (!tr) return;
    let row;
    const del = () => {
      comments.splice(comments.indexOf(c), 1);
      saveReview(a.id);
      removeRow(row);
      drawReview();
    };
    row = insertRow(el, tr, h("div", { class: "cm-box saved" },
      h("div", { class: "cm-head" }, h("span", {}, `Pending · ${c.side === "old" ? "removed " : ""}line ${c.line}`), h("button", { class: "link", onclick: del }, "Delete")),
      md(c.text)), "saved");
    row.dataset.id = c.id;
  };

  const openComposer = (el, tr, draft) => {
    const ta = h("textarea", { class: "cm-input", rows: 3, placeholder: `Comment on ${draft.file}:${draft.line} (⌘↩ to add, Esc to cancel)` });
    let row;
    const add = () => {
      const text = ta.value.trim();
      if (!text) return;
      removeRow(row);
      const c = { ...draft, id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, text };
      comments.push(c);
      saveReview(a.id);
      placeComment(el, c);
      drawReview();
    };
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); }
      if (e.key === "Escape") removeRow(row);
    });
    row = insertRow(el, tr, h("div", { class: "cm-box" }, ta,
      h("div", { class: "cm-actions" }, h("button", { class: "btn", onclick: () => removeRow(row) }, "Cancel"), h("button", { class: "btn primary", onclick: add }, "Add comment"))), "composer");
    ta.focus();
  };

  const expand = async (i, full) => {
    const f = files[i];
    const context = full ? 100000 : (f.context ?? 3) + 25;
    try {
      const r = await api(`/api/artifacts/${a.id}/diff?path=${encodeURIComponent(f.path)}&old=${encodeURIComponent(f.oldPath)}&context=${context}`);
      Object.assign(f, { shown: r.diff, context, full });
      drawFile(i);
    } catch (e) { toast(e.message); }
  };

  const drawFile = (i) => {
    const f = files[i], el = sections[i];
    el.replaceChildren();
    new Diff2HtmlUI(el, f.shown ?? f.diff, {
      drawFileList: false, outputFormat: side ? "side-by-side" : "line-by-line", matching: "lines",
      highlight: true, colorScheme: effectiveTheme(), fileContentToggle: true, stickyFileHeaders: false,
    }).draw();

      header.append(h("div", { class: "file-actions" },
        h("button", { class: "btn", title: "Show 25 more lines around each change", onclick: () => expand(i, false) }, "Expand ↕"),
        h("button", { class: "btn", title: "Show the whole file", onclick: () => expand(i, true) }, "Full file")));
    for (const c of comments) if (c.file === f.path) placeComment(el, c);
  };

  sections.forEach((el, i) => el.addEventListener("click", (e) => {
    if (e.target.closest(".cm-row")) return;
    if (e.target.closest("td.d2h-info")) { if (canExpand && !files[i].full) expand(i, false); return; }
    const td = e.target.closest("td.d2h-code-linenumber, td.d2h-code-side-linenumber");
    if (!td || td.classList.contains("d2h-code-side-emptyplaceholder")) return;
    const { side: where, line } = clickedLine(el, td);
    if (!line) return;
    const tr = td.parentElement;
    if (tr.nextElementSibling?.classList.contains("composer")) return tr.nextElementSibling.querySelector("textarea").focus();
    openComposer(el, tr, { file: files[i].path, side: where, line, code: tr.querySelector(".d2h-code-line-ctn")?.textContent ?? "" });
  }));

  const jumpTo = (c) => {
    const i = files.findIndex((f) => f.path === c.file);
    if (i < 0) return;

    (row ?? sections[i]).scrollIntoView({ block: row ? "center" : "start" });

    }
  }, { rootMargin: "0px 0px -75% 0px" });
  sections.forEach((el) => seen.observe(el));

  const viewBtn = h("button", { class: "btn" });
  const treeBtn = h("button", { class: "btn" }, "Hide files");
  const drawAll = () => {
    viewBtn.textContent = side ? "Unified view" : "Split view";
    files.forEach((_, i) => drawFile(i));
  };
  viewBtn.addEventListener("click", () => { side = !side; drawAll(); });
  treeBtn.addEventListener("click", () => { treeBtn.textContent = grid.classList.toggle("no-tree") ? "Show files" : "Hide files"; });

  wrap.append(h("div", { class: "files-bar" },
    h("div", { class: "label" }, `Files changed · ${files.length}`),
    canExpand ? null : h("span", { class: "muted", style: "font-size:12px" }, "Captured before context expansion was available"),
    treeBtn, viewBtn));
  grid.append(tree, h("div", {}, ...sections));
  wrap.append(files.length ? grid : h("div", { class: "empty" }, "No diff captured."));
  if (files.length) drawAll();
  drawReview();
  wrap.refresh = drawReview;
  return wrap;
}

function replyBox(s) {
  const ta = h("textarea", { placeholder: `Reply to ${s.display_name}… (Enter sends, Shift+Enter newline)`, rows: 1 });
  const send = async () => {
    const text = ta.value.trim();
    if (!text) return;
    try { await api(`/api/sessions/${s.id}/send`, { method: "POST", body: JSON.stringify({ text }) }); ta.value = ""; toast("Sent"); }
    catch (e) { toast(e.message); }
  };
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  return h("div", { class: "reply" }, ta, h("button", { class: "btn primary", onclick: send }, "Send"));
}

function notifyTransitions() {
  for (const s of sessions) {
    const k = kind(s);
    const before = prevKind.get(s.id);
    if (before && before !== k && (k === "blocked" || k === "waiting") && window.Notification?.permission === "granted" && document.hidden) {
      const n = new Notification(`${s.display_name}: ${s.label}`, { body: s.detail || "", tag: s.id });
      n.onclick = () => { window.focus(); select(s.id); };
    }
    prevKind.set(s.id, k);
  }
}

function connect() {
  const es = new EventSource(`/api/stream?token=${encodeURIComponent(TOKEN)}`);
  es.addEventListener("sessions", (e) => {
    sessions = JSON.parse(e.data);
    $("#live").classList.add("on");
    notifyTransitions();
    if (!selected && sessions.length) selected = sessions[0].id;
    renderList();
    renderMain();
  });
  es.onerror = () => $("#live").classList.remove("on");
}

$("#notify").addEventListener("click", async () => {
  if (!("Notification" in window)) return toast("Notifications unsupported");
  toast((await Notification.requestPermission()) === "granted" ? "Notifications on" : "Notifications blocked");
});
async function checkVersion() {
  try {
    const v = await api("/api/version");
    const btn = $("#restart");
    btn.classList.toggle("update", v.stale);
    btn.textContent = v.stale ? "Restart server · update" : "Restart server";
    btn.title = v.stale
      ? `carriot moved from ${v.commit} to ${v.current} since this server started; restart to run it`
      : `Running ${v.commit ?? "unknown commit"}, started ${ago(v.startedAt)} ago`;
  } catch {}
}

$("#restart").addEventListener("click", async () => {
  const btn = $("#restart");
  btn.disabled = true;
  btn.textContent = "Restarting…";
  try { await api("/api/restart", { method: "POST" }); } catch {}
  // A new server issues a new token, so reload the page once it answers instead of reconnecting.
  const deadline = Date.now() + 20000;
  await new Promise((r) => setTimeout(r, 600));
  while (Date.now() < deadline) {
    try {
      const res = await fetch("/", { cache: "no-store" });
      if (res.ok) return location.reload();
    } catch {}
    await new Promise((r) => setTimeout(r, 500));
  }
  btn.disabled = false;
  btn.textContent = "Restart server";
  toast("The server did not come back. Run carriot open in a terminal.");
});
checkVersion();
setInterval(checkVersion, 60000);

$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("carriot-theme", next); } catch {}
  themeChanged();
});
try { const t = localStorage.getItem("carriot-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
function setCollapsed(on) {
  $(".app").classList.toggle("collapsed", on);
  $("#collapse").textContent = on ? "»" : "«";
  $("#collapse").title = on ? "Expand sessions ([)" : "Collapse sessions ([)";
  try { localStorage.setItem("carriot-collapsed", on ? "1" : ""); } catch {}
}
$("#collapse").addEventListener("click", () => setCollapsed(!$(".app").classList.contains("collapsed")));
let startCollapsed = false;
try { startCollapsed = localStorage.getItem("carriot-collapsed") === "1"; } catch {}
setCollapsed(startCollapsed);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeChanged);
syncHljs();
window.addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== selected) select(id); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  const i = sessions.findIndex((s) => s.id === selected);
  if (e.key === "j" && i < sessions.length - 1) select(sessions[i + 1].id);
  if (e.key === "k" && i > 0) select(sessions[i - 1].id);
  if (e.key === "o" && selected) $(".btn.primary")?.click();
  if (e.key === "[") setCollapsed(!$(".app").classList.contains("collapsed"));
});
setInterval(() => { for (const el of document.querySelectorAll("[data-ts]")) el.textContent = ago(Number(el.dataset.ts)); }, 1000);
connect();
</script>
</body>
</html>
